<app-page-breadcrumb pageTitle="Profile" />
<div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
  <h3 class="mb-5 text-lg font-semibold text-gray-800 dark:text-white/90 lg:mb-7">
    Account Settings
  </h3>

  @if (isLoading) {
    <div class="py-10 text-center text-sm text-gray-500 dark:text-gray-400">Loading profile...</div>
  } @else {
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      <div class="rounded-xl border border-gray-200 p-4 dark:border-gray-800">
        <h4 class="mb-3 text-sm font-semibold text-gray-700 dark:text-gray-200">Profile Image</h4>
        <div class="flex flex-col items-center gap-3">
          <img
            [src]="profilePreviewImage"
            alt="Profile"
            class="h-28 w-28 rounded-full border border-gray-200 object-cover dark:border-gray-700"
          />
          <label class="cursor-pointer rounded-lg border border-brand-300 px-3 py-2 text-xs font-medium text-brand-700 hover:bg-brand-50 dark:border-brand-700 dark:text-brand-300 dark:hover:bg-brand-500/10">
            Upload Image
            <input
              type="file"
              accept="image/*"
              class="hidden"
              (change)="onProfileImageSelected($event)"
            />
          </label>
          <button
            type="button"
            (click)="removeProfileImage()"
            class="rounded-lg border border-gray-300 px-3 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
          >
            Remove
          </button>
        </div>
      </div>

      <div class="lg:col-span-2 rounded-xl border border-gray-200 p-4 dark:border-gray-800">
        <h4 class="mb-3 text-sm font-semibold text-gray-700 dark:text-gray-200">Basic Information</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Full Name</label>
            <input
              type="text"
              [(ngModel)]="form.fullName"
              name="fullName"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Email</label>
            <input
              type="email"
              [(ngModel)]="form.email"
              name="email"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Contact</label>
            <input
              type="text"
              [(ngModel)]="form.contact"
              name="contact"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Birthdate</label>
            <input
              type="date"
              [(ngModel)]="form.birthdate"
              name="birthdate"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div class="md:col-span-2">
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Address</label>
            <textarea
              rows="3"
              [(ngModel)]="form.address"
              name="address"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            ></textarea>
          </div>
        </div>

        <div class="mt-4">
          <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Confirm your password</label>
          <input
            type="password"
            [(ngModel)]="authorizationPassword"
            name="profileAuthorizationPassword"
            class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            placeholder="Required to save profile changes"
          />
        </div>

        <div class="mt-4 flex justify-end">
          <button
            type="button"
            (click)="saveProfile()"
            [disabled]="isSaving"
            class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600 disabled:opacity-60"
          >
            {{ isSaving ? 'Saving...' : 'Save Profile' }}
          </button>
        </div>
      </div>

      <div class="lg:col-span-3 rounded-xl border border-gray-200 p-4 dark:border-gray-800">
        <h4 class="mb-3 text-sm font-semibold text-gray-700 dark:text-gray-200">Change Password</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Current Password</label>
            <input
              type="password"
              [(ngModel)]="passwordForm.currentPassword"
              name="currentPassword"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">New Password</label>
            <input
              type="password"
              [(ngModel)]="passwordForm.newPassword"
              name="newPassword"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-gray-600 dark:text-gray-300">Retry New Password</label>
            <input
              type="password"
              [(ngModel)]="passwordForm.retryNewPassword"
              name="retryNewPassword"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
        </div>

        <div class="mt-4 flex justify-end">
          <button
            type="button"
            (click)="changePassword()"
            [disabled]="isChangingPassword"
            class="inline-flex items-center justify-center rounded-lg bg-error-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-error-600 disabled:opacity-60"
          >
            {{ isChangingPassword ? 'Changing...' : 'Change Password' }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
